<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart Grocery Shop</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- ================= HEADER ================= -->
    <header class="bg-green-600 text-white shadow-md">

        <div class="max-w-7xl mx-auto px-5 py-4">

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                <!-- Logo -->
                <div>
                    <h1 class="text-3xl font-bold">
                        🛒 FreshMart
                    </h1>

                    <p class="text-green-100 text-sm">
                        Fresh groceries at your doorstep
                    </p>
                </div>

                <!-- Search -->
                <div class="flex-1 max-w-md">
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search groceries..."
                        class="w-full px-4 py-3 rounded-lg text-gray-800 focus:outline-none focus:ring-2 focus:ring-green-300"
                    >
                </div>

                <!-- Cart -->
                <button
                    id="cartButton"
                    class="bg-white text-green-700 px-5 py-3 rounded-lg font-bold hover:bg-green-50"
                >
                    🛒 Cart (<span id="cartCount">0</span>)
                </button>

            </div>

        </div>

    </header>


    <!-- ================= HERO ================= -->
    <section class="bg-green-50">

        <div class="max-w-7xl mx-auto px-5 py-12 text-center">

            <h2 class="text-4xl md:text-5xl font-bold text-green-700 mb-4">
                Fresh & Healthy Groceries
            </h2>

            <p class="text-gray-600 text-lg mb-6">
                Everything you need for your daily shopping.
            </p>

            <button
                onclick="document.getElementById('products').scrollIntoView()"
                class="bg-green-600 hover:bg-green-700 text-white px-7 py-3 rounded-lg font-bold"
            >
                Shop Now
            </button>

        </div>

    </section>


    <!-- ================= CATEGORIES ================= -->
    <section class="max-w-7xl mx-auto px-5 py-8">

        <h2 class="text-2xl font-bold mb-5">
            Shop by Category
        </h2>

        <div class="flex flex-wrap gap-3">

            <button
                class="categoryBtn bg-green-600 text-white px-5 py-2 rounded-full"
                data-category="All"
            >
                All
            </button>

            <button
                class="categoryBtn bg-white border px-5 py-2 rounded-full hover:bg-green-50"
                data-category="Vegetables"
            >
                🥦 Vegetables
            </button>

            <button
                class="categoryBtn bg-white border px-5 py-2 rounded-full hover:bg-green-50"
                data-category="Fruits"
            >
                🍎 Fruits
            </button>

            <button
                class="categoryBtn bg-white border px-5 py-2 rounded-full hover:bg-green-50"
                data-category="Dairy"
            >
                🥛 Dairy
            </button>

            <button
                class="categoryBtn bg-white border px-5 py-2 rounded-full hover:bg-green-50"
                data-category="Snacks"
            >
                🍪 Snacks
            </button>

            <button
                class="categoryBtn bg-white border px-5 py-2 rounded-full hover:bg-green-50"
                data-category="Staples"
            >
                🌾 Staples
            </button>

        </div>

    </section>


    <!-- ================= PRODUCTS ================= -->
    <section
        id="products"
        class="max-w-7xl mx-auto px-5 pb-12"
    >

        <div class="flex justify-between items-center mb-6">

            <h2 class="text-2xl font-bold">
                Popular Groceries
            </h2>

            <span
                id="productCount"
                class="text-gray-500"
            >
                12 Products
            </span>

        </div>


        <div
            id="productGrid"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"
        >
        </div>

        <p
            id="noProducts"
            class="hidden text-center text-gray-500 py-10"
        >
            No products found.
        </p>

    </section>


    <!-- ================= CART MODAL ================= -->
    <div
        id="cartModal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-5 z-50"
    >

        <div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">

            <!-- Cart Header -->
            <div class="flex justify-between items-center p-6 border-b">

                <h2 class="text-2xl font-bold">
                    🛒 Your Cart
                </h2>

                <button
                    id="closeCart"
                    class="text-gray-500 hover:text-red-500 text-2xl"
                >
                    &times;
                </button>

            </div>


            <!-- Cart Items -->
            <div
                id="cartItems"
                class="p-6"
            >
            </div>


            <!-- Cart Footer -->
            <div class="border-t p-6">

                <div class="flex justify-between text-xl font-bold mb-5">

                    <span>
                        Total:
                    </span>

                    <span class="text-green-600">
                        ₹<span id="cartTotal">0</span>
                    </span>

                </div>

                <button
                    id="checkoutButton"
                    class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold"
                >
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->
    <footer class="bg-gray-900 text-white">

        <div class="max-w-7xl mx-auto px-5 py-8 text-center">

            <h2 class="text-2xl font-bold mb-2">
                🛒 FreshMart
            </h2>

            <p class="text-gray-400">
                Your trusted online grocery store.
            </p>

            <p class="text-gray-500 text-sm mt-4">
                © 2026 FreshMart Grocery Shop
            </p>

        </div>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->
    <script>

        // Product data
        const products = [

            {
                id: 1,
                name: "Fresh Tomatoes",
                category: "Vegetables",
                price: 40,
                unit: "1 kg",
                emoji: "🍅"
            },

            {
                id: 2,
                name: "Potatoes",
                category: "Vegetables",
                price: 35,
                unit: "1 kg",
                emoji: "🥔"
            },

            {
                id: 3,
                name: "Fresh Apples",
                category: "Fruits",
                price: 120,
                unit: "1 kg",
                emoji: "🍎"
            },

            {
                id: 4,
                name: "Bananas",
                category: "Fruits",
                price: 50,
                unit: "1 dozen",
                emoji: "🍌"
            },

            {
                id: 5,
                name: "Milk",
                category: "Dairy",
                price: 60,
                unit: "1 litre",
                emoji: "🥛"
            },

            {
                id: 6,
                name: "Cheese",
                category: "Dairy",
                price: 100,
                unit: "200 g",
                emoji: "🧀"
            },

            {
                id: 7,
                name: "Biscuits",
                category: "Snacks",
                price: 30,
                unit: "1 pack",
                emoji: "🍪"
            },

            {
                id: 8,
                name: "Potato Chips",
                category: "Snacks",
                price: 40,
                unit: "1 pack",
                emoji: "🍟"
            },

            {
                id: 9,
                name: "Rice",
                category: "Staples",
                price: 70,
                unit: "1 kg",
                emoji: "🍚"
            },

            {
                id: 10,
                name: "Wheat Flour",
                category: "Staples",
                price: 55,
                unit: "1 kg",
                emoji: "🌾"
            },

            {
                id: 11,
                name: "Carrots",
                category: "Vegetables",
                price: 45,
                unit: "1 kg",
                emoji: "🥕"
            },

            {
                id: 12,
                name: "Mangoes",
                category: "Fruits",
                price: 150,
                unit: "1 kg",
                emoji: "🥭"
            }

        ];


        // Cart
        let cart = [];


        // Get elements
        const productGrid =
            document.getElementById("productGrid");

        const searchInput =
            document.getElementById("searchInput");

        const cartCount =
            document.getElementById("cartCount");

        const cartModal =
            document.getElementById("cartModal");

        const cartItems =
            document.getElementById("cartItems");

        const cartTotal =
            document.getElementById("cartTotal");

        const productCount =
            document.getElementById("productCount");

        const noProducts =
            document.getElementById("noProducts");


        // Display products
        function displayProducts(productList) {

            productGrid.innerHTML = "";

            productCount.textContent =
                productList.length + " Products";


            if (productList.length === 0) {

                noProducts.classList.remove("hidden");

                return;

            }

            noProducts.classList.add("hidden");


            productList.forEach(function(product) {

                const card = document.createElement("div");

                card.className =
                    "bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition";


                card.innerHTML = `

                    <div class="bg-green-50 h-40 flex items-center justify-center text-7xl">
                        ${product.emoji}
                    </div>

                    <div class="p-5">

                        <p class="text-sm text-green-600 font-semibold">
                            ${product.category}
                        </p>

                        <h3 class="text-xl font-bold mt-1">
                            ${product.name}
                        </h3>

                        <p class="text-gray-500 text-sm mt-1">
                            ${product.unit}
                        </p>

                        <div class="flex justify-between items-center mt-4">

                            <span class="text-xl font-bold text-green-600">
                                ₹${product.price}
                            </span>

                            <button
                                onclick="addToCart(${product.id})"
                                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-semibold"
                            >
                                Add
                            </button>

                        </div>

                    </div>

                `;

                productGrid.appendChild(card);

            });

        }


        // Add product to cart
        function addToCart(productId) {

            const product =
                products.find(function(item) {
                    return item.id === productId;
                });


            const existingProduct =
                cart.find(function(item) {
                    return item.id === productId;
                });


            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({
                    ...product,
                    quantity: 1
                });

            }


            updateCart();

        }


        // Update cart
        function updateCart() {

            cartItems.innerHTML = "";

            let total = 0;

            let count = 0;


            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <p class="text-center text-gray-500">
                        Your cart is empty.
                    </p>
                `;

            }


            cart.forEach(function(item) {

                const itemTotal =
                    item.price * item.quantity;

                total += itemTotal;

                count += item.quantity;


                const div = document.createElement("div");

                div.className =
                    "flex items-center justify-between border-b py-4";


                div.innerHTML = `

                    <div>

                        <h3 class="font-bold">
                            ${item.emoji} ${item.name}
                        </h3>

                        <p class="text-gray-500 text-sm">
                            ₹${item.price} × ${item.quantity}
                        </p>

                    </div>

                    <div class="flex items-center gap-2">

                        <button
                            onclick="changeQuantity(${item.id}, -1)"
                            class="bg-gray-200 px-3 py-1 rounded"
                        >
                            −
                        </button>

                        <span class="font-bold">
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${item.id}, 1)"
                            class="bg-gray-200 px-3 py-1 rounded"
                        >
                            +
                        </button>

                    </div>

                `;

                cartItems.appendChild(div);

            });


            cartCount.textContent = count;

            cartTotal.textContent = total;

        }


        // Change quantity
        function changeQuantity(productId, change) {

            const item =
                cart.find(function(product) {
                    return product.id === productId;
                });


            if (!item) return;


            item.quantity += change;


            if (item.quantity <= 0) {

                cart =
                    cart.filter(function(product) {
                        return product.id !== productId;
                    });

            }


            updateCart();

        }


        // Search products
        searchInput.addEventListener("input", function() {

            const searchText =
                searchInput.value.toLowerCase();


            const filteredProducts =
                products.filter(function(product) {

                    return (
                        product.name.toLowerCase()
                            .includes(searchText)
                        ||
                        product.category.toLowerCase()
                            .includes(searchText)
                    );

                });


            displayProducts(filteredProducts);

        });


        // Category buttons
        const categoryButtons =
            document.querySelectorAll(".categoryBtn");


        categoryButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                const category =
                    button.dataset.category;


                let filteredProducts;


                if (category === "All") {

                    filteredProducts = products;

                } else {

                    filteredProducts =
                        products.filter(function(product) {

                            return product.category === category;

                        });

                }


                displayProducts(filteredProducts);


                // Clear search
                searchInput.value = "";

            });

        });


        // Open cart
        document.getElementById("cartButton")
            .addEventListener("click", function() {

                cartModal.classList.remove("hidden");

                updateCart();

            });


        // Close cart
        document.getElementById("closeCart")
            .addEventListener("click", function() {

                cartModal.classList.add("hidden");

            });


        // Checkout
        document.getElementById("checkoutButton")
            .addEventListener("click", function() {

                if (cart.length === 0) {

                    alert("Your cart is empty!");

                    return;

                }


                alert(
                    "Order placed successfully! Thank you for shopping with FreshMart."
                );


                cart = [];

                updateCart();

                cartModal.classList.add("hidden");

            });


        // Display all products initially
        displayProducts(products);

    </script>

</body>
</html>
